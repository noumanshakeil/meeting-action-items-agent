[project]
name = "meeting-action-items-agent"
version = "2.0.0"
description = "Turns meeting notes into tracked action items with owners, due dates, and board status — LLM extraction included."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
