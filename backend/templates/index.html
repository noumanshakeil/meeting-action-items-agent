<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Paste notes → extract owners/dates → move cards across the board.</p>
<div class="grid"><section class="card"><h2>Ingest notes</h2>
<form method="post" action="/ui/ingest"><label>Title</label><input name="title" required/>
<label>Notes</label><textarea name="notes" rows="8" required></textarea><button type="submit">Extract actions</button></form></section>
<section class="card"><h2>Board</h2><table><thead><tr><th>Item</th><th>Owner</th><th>Status</th></tr></thead><tbody>
{% for i in items %}<tr><td>{{ i.text }}{% if i.due %}<div class="sub">due {{ i.due }}</div>{% endif %}</td><td>{{ i.owner }}</td>
<td class="row"><span class="pill">{{ i.status }}</span>
<form method="post" action="/ui/items/{{ i.id }}/doing"><button type="submit">Doing</button></form>
<form method="post" action="/ui/items/{{ i.id }}/done"><button class="secondary" type="submit">Done</button></form></td></tr>
{% else %}<tr><td colspan="3">No actions yet.</td></tr>{% endfor %}
</tbody></table></section></div></main></body></html>
